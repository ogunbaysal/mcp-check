name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, lts/*]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test against the valid fixture
        run: node ./dist/index.js node ./fixtures/valid-server/dist/index.js

      - name: Smoke test --json output is parseable
        run: node ./dist/index.js --json node ./fixtures/valid-server/dist/index.js | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"

      - name: Smoke test the broken fixture fails
        run: |
          if node ./dist/index.js node ./fixtures/broken-server/dist/index.js; then
            echo "expected mcp-probe to exit non-zero for the broken fixture" >&2
            exit 1
          fi
